[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcbench"
version = "0.1.0"
description = "Reproducible quantum computer characterization from hardware circuits and shot counts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "QCBench contributors"}]
keywords = ["quantum", "QPU", "hardware", "benchmark", "characterization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.2,<3"]
ibm = ["qiskit>=1.2,<3", "qiskit-ibm-runtime>=0.30,<1"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/qcbench-org/qcbench"
Repository = "https://github.com/qcbench-org/qcbench"
Issues = "https://github.com/qcbench-org/qcbench/issues"

[project.scripts]
qcbench = "qcbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
